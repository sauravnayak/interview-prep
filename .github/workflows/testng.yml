name: SDET Interview Prep Test Suite

on:
  push:
    branches: [master ]
  pull_request:
    branches: [master ]
  workflow_dispatch:

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java Environment (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'maven'

      - name: Execute Active TestNG Suites
        run: mvn clean test

      - name: Generate and Deploy Allure Report to GitHub Pages
        uses: mgrybyk-org/allure-report-gh-pages-action@v2
        if: always()
        with:
          allure_results: target/allure-results
          allure_report: allure-report
          gh_pages: gh-pages
